<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Student Registration</h1>
      <p class="intro">Enter the student details to register.</p>
 
      <form id="studentForm" novalidate>
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter full name">
 
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com">
 
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit phone number">
 
        <label for="course">Course</label>
        <select id="course">
          <option value="">Select a course</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="JavaScript">JavaScript</option>
          <option value="Full Stack Development">Full Stack Development</option>
        </select>
 
        <button type="submit">Register</button>
        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </section>
 
    <section class="card records">
      <h2>Registered Students</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Course</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <tr id="emptyRow"><td colspan="5">No students registered yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
